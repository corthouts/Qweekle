<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Ventes du jour — Qweekle</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#7c3aed; --accent2:#22c55e; --pos:#7c3aed; --front:#0ea5e9; --web:#f59e0b; --other:#64748b;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b1120; --card:#111a2e; --ink:#f1f5f9; --muted:#94a3b8; --line:#1e293b;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px);
    max-width:520px; margin:0 auto; -webkit-font-smoothing:antialiased;
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 2px 14px}
  .brand{display:flex; flex-direction:column; line-height:1.1}
  .brand b{font-size:1.05rem; letter-spacing:-.01em}
  .brand span{font-size:.72rem; color:var(--muted); margin-top:2px}
  .iconbtn{border:none; background:var(--card); color:var(--ink); width:40px; height:40px; border-radius:12px;
    box-shadow:var(--shadow); font-size:1.05rem; cursor:pointer; display:grid; place-items:center}
  .iconbtn:active{transform:scale(.94)}
  .card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .hero .lbl{font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600}
  .hero .amount{font-size:3.1rem; font-weight:800; letter-spacing:-.03em; margin:6px 0 2px; line-height:1}
  .hero .sub{color:var(--muted); font-size:.9rem}
  .metrics{display:flex; gap:10px; margin-top:16px}
  .metric{flex:1; background:var(--bg); border-radius:14px; padding:12px 10px; text-align:center}
  .metric b{display:block; font-size:1.2rem; font-weight:800; letter-spacing:-.02em}
  .metric small{color:var(--muted); font-size:.72rem}
  .metric.neg b{color:#ef4444}
  .subline{margin-top:12px; font-size:.8rem; color:var(--muted); text-align:center}
  .pill{display:inline-block; font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--accent2); background:rgba(34,197,94,.12); border-radius:999px; padding:3px 9px; vertical-align:middle; margin-left:8px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600;
    background:var(--bg); border-radius:999px; padding:6px 11px; color:var(--ink)}
  .dot{width:9px; height:9px; border-radius:50%}
  .sectiontitle{display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 10px; gap:8px}
  .sectiontitle b{font-size:.95rem}
  .sectiontitle span{font-size:.78rem; color:var(--muted); text-align:right}
  .bars{display:flex; align-items:flex-end; gap:7px; height:120px; padding-top:6px}
  .bar{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
  .bar .col{width:100%; border-radius:7px 7px 3px 3px; background:linear-gradient(180deg,var(--accent),#a78bfa);
    min-height:4px; transition:height .5s cubic-bezier(.2,.8,.2,1)}
  .bar.today .col{background:linear-gradient(180deg,var(--accent2),#4ade80)}
  .bar .d{font-size:.66rem; color:var(--muted); font-weight:600}
  .bar .v{font-size:.6rem; color:var(--muted)}
  .bar.today .d{color:var(--accent2)}
  .irow{display:flex; align-items:center; gap:10px; padding:9px 2px; border-top:1px solid var(--line); font-size:.9rem}
  .irow:first-child{border-top:none}
  .iq{min-width:38px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums}
  .il{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ia{color:var(--muted); font-weight:600; font-size:.82rem; white-space:nowrap}
  .ia .g{color:var(--accent2)}
  .il small{display:block; font-weight:400; color:var(--muted); font-size:.7rem; white-space:normal}
  .irow.dep .iq{color:var(--front)}
  .miniload{color:var(--muted); font-size:.85rem; padding:10px 2px; display:flex; align-items:center; gap:8px}
  .miniload .s{width:15px; height:15px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:sp .8s linear infinite}
  /* anniversaires à venir */
  .pday + .pday{margin-top:16px}
  .pdh{display:flex; justify-content:space-between; align-items:baseline; padding:0 2px 6px; border-bottom:2px solid var(--line)}
  .pdh b{font-size:.95rem}
  .pdh span{font-size:.72rem; color:var(--muted)}
  .psh{font-size:.7rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:11px 2px 6px}
  .pcard{padding:9px 10px; border-radius:12px; margin-bottom:6px; background:var(--bg); cursor:pointer}
  .pcard:active{transform:scale(.99)}
  .pcard.warn{background:rgba(245,158,11,.14); box-shadow:inset 3px 0 0 var(--web)}
  .ptop{display:flex; align-items:center; gap:11px}
  .pg{min-width:36px; height:36px; border-radius:9px; background:var(--accent); color:#fff; font-weight:800; display:grid; place-items:center; font-size:.95rem; font-variant-numeric:tabular-nums}
  .pcard.warn .pg{background:var(--web)}
  .pi{flex:1; min-width:0}
  .pi b{font-size:.88rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pi small{font-size:.72rem; color:var(--muted)}
  .ptag{font-size:.62rem; font-weight:800; color:var(--web); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; align-self:flex-start; margin-top:2px}
  .pnote{font-size:.77rem; color:var(--muted); line-height:1.4; margin-top:7px; padding-left:47px; white-space:normal}
  .pnote.client{color:var(--front); font-weight:500}
  /* remplissage de la journée */
  .fillbig{font-size:2.3rem; font-weight:800; letter-spacing:-.03em; line-height:1; margin:8px 0 2px}
  .fillbig small{font-size:.95rem; font-weight:600; color:var(--muted)}
  .fillsub{color:var(--muted); font-size:.83rem; margin-bottom:2px; min-height:1.1em}
  .fillsub .wave{color:var(--web); font-weight:700}
  .fillchart{width:100%; height:180px; display:block; margin-top:6px}
  .fillchart text{font-family:inherit}
  .filllegend{display:flex; gap:16px; margin-top:8px; font-size:.72rem; color:var(--muted)}
  .filllegend i{display:inline-block; width:16px; height:0; border-top:3px solid var(--accent); vertical-align:middle; margin-right:5px; border-radius:2px}
  .filllegend i.proj{border-top:3px dashed var(--muted)}
  .rows{margin-top:6px}
  .row{display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row .day{font-weight:600; font-size:.9rem}
  .row .day small{display:block; color:var(--muted); font-weight:400; font-size:.72rem}
  .row .val{text-align:right}
  .row .val b{font-size:1rem; font-weight:800; letter-spacing:-.01em}
  .row .val small{display:block; color:var(--muted); font-size:.72rem}
  .row.is-today{background:linear-gradient(90deg,transparent,rgba(34,197,94,.08)); border-radius:12px; margin:0 -6px; padding:11px 10px; border-top:none}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .foot{text-align:center; color:var(--muted); font-size:.72rem; margin-top:8px; line-height:1.5}
  .spin{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent);
    animation:sp .8s linear infinite; margin:26px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{background:#fef2f2; color:#b91c1c; border-radius:12px; padding:12px 14px; font-size:.85rem; margin-bottom:12px}
  @media (prefers-color-scheme:dark){.err{background:#3f1d1d; color:#fecaca}}
  /* token overlay */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
  .overlay.on{display:flex}
  .modal{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:22px; width:100%; max-width:380px}
  .modal h2{margin:0 0 6px; font-size:1.1rem}
  .modal p{margin:0 0 14px; color:var(--muted); font-size:.85rem; line-height:1.5}
  .modal input{width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:12px; padding:12px 14px; font-size:.95rem; margin-bottom:12px; font-family:ui-monospace,Menlo,monospace}
  .btn{width:100%; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:.95rem;
    border-radius:12px; padding:13px; cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent; color:var(--muted); font-weight:600; margin-top:8px}
  .updated{font-size:.72rem; color:var(--muted); text-align:center; margin:-4px 0 12px}
  .pulse{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent2); margin-right:5px; vertical-align:middle}
  /* pop-up fiche client */
  .cli-h{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700}
  .cli-name{font-size:1.3rem; font-weight:800; letter-spacing:-.02em; margin:3px 0 1px}
  .cli-sub{color:var(--muted); font-size:.82rem; margin-bottom:16px}
  .cli-row{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; background:var(--bg); margin-bottom:8px; text-decoration:none; color:var(--ink)}
  .cli-row:active{transform:scale(.98)}
  .cli-row .ic{font-size:1.15rem; width:22px; text-align:center}
  .cli-row .lbl{font-size:.68rem; color:var(--muted); display:block}
  .cli-row .val{font-weight:600; font-size:.95rem; word-break:break-word}
  .cli-empty{color:var(--muted); font-size:.9rem; padding:10px 0 6px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <b id="ventureName">O'minüs</b>
    <span id="ventureSub">Suivi des ventes</span>
  </div>
  <button class="iconbtn" id="refreshBtn" title="Rafraîchir" aria-label="Rafraîchir">⟳</button>
</header>

<div id="updated" class="updated"></div>
<div id="content"><div class="spin"></div></div>

<div class="foot" id="foot"></div>

<!-- Token modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Connexion Qweekle</h2>
    <p>Collez votre <b>token API</b> (jeton personnel Qweekle). Il reste stocké uniquement sur cet appareil et n'est jamais partagé.</p>
    <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="1393|xxxxxxxx…">
    <button class="btn" id="saveToken">Enregistrer</button>
    <button class="btn ghost" id="clearToken">Effacer le token de cet appareil</button>
  </div>
</div>

<!-- Pop-up fiche client -->
<div class="overlay" id="clientOverlay">
  <div class="modal">
    <div id="clientBody"></div>
    <button class="btn ghost" id="clientClose">Fermer</button>
  </div>
</div>

<script>
const API = "https://api.qweekle.io/api";
const TZ  = "Europe/Brussels";
const LS_TOKEN = "qw_token";
const LS_CACHE = "qw_cache_v1";
const MAX_PAGES = 30;          // garde-fou
const WINDOW_DAYS = 7;         // fenêtre affichée
const AUTOREFRESH_MS = 5*60*1000;

const $ = s => document.querySelector(s);
const eur = n => (n<0? "-":"") + "€" + Math.abs(n).toLocaleString("fr-BE",{minimumFractionDigits:0,maximumFractionDigits:0});
const eur2 = n => "€" + n.toLocaleString("fr-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// -- date helpers (jour "local" établissement, Europe/Brussels) --
function dayKeyInTZ(d){ // Date -> "YYYY-MM-DD" in Brussels
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  return p; // en-CA gives YYYY-MM-DD
}
function todayKey(){ return dayKeyInTZ(new Date()); }
function keyMinusDays(key,n){ const d=new Date(key+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
function labelFor(key){
  const d=new Date(key+"T12:00:00Z");
  const wd=["dim","lun","mar","mer","jeu","ven","sam"][d.getUTCDay()];
  return {wd, dm:d.getUTCDate()+"/"+(d.getUTCMonth()+1)};
}

function getToken(){ return localStorage.getItem(LS_TOKEN)||""; }
function needToken(){ $("#overlay").classList.add("on"); }
function hideToken(){ $("#overlay").classList.remove("on"); }

async function apiGet(path){
  const r = await fetch(API+path, {headers:{accept:"application/json",authorization:"Bearer "+getToken()}});
  if(r.status===401||r.status===403){ const e=new Error("auth"); e.auth=true; throw e; }
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

// Récupère assez de pages (depuis la fin) pour couvrir la fenêtre de jours
async function fetchRecentSales(){
  const first = await apiGet("/sales?page=1");
  const last = first.metadata.lastPage;
  const cutoff = keyMinusDays(todayKey(), WINDOW_DAYS); // borne basse
  const rows = [];
  let p = last, fetched = 0, done = false;
  while(p>=1 && fetched<MAX_PAGES && !done){
    // vague de pages en parallèle
    const wave = [];
    for(let i=0;i<6 && p-i>=1;i++) wave.push(p-i);
    const res = await Promise.all(wave.map(pg=>apiGet("/sales?page="+pg)));
    fetched += wave.length;
    for(const d of res){ for(const s of d.data) rows.push(s); }
    // la plus ancienne ligne de la vague la plus basse
    const lowest = res[res.length-1].data;
    const oldest = lowest.length? lowest[0].created_at.slice(0,10) : "9999";
    if(oldest < cutoff) done = true;
    p -= wave.length;
  }
  return rows;
}

function aggregate(rows){
  const today = todayKey();
  const from = keyMinusDays(today, WINDOW_DAYS-1); // 7 jours incluant aujourd'hui
  const days = {};
  for(let i=0;i<WINDOW_DAYS;i++){ const k=keyMinusDays(today,i); days[k]={key:k,brut:0,remb:0,rembN:0,net:0,ht:0,n:0,src:{}}; }
  for(const s of rows){
    const k = s.created_at.slice(0,10);
    if(k<from || k>today) continue;
    const b=days[k]; if(!b) continue;
    const amt = Number(s.amount)||0;
    const ht = Number(s.amount_excl_taxes)||0;
    if(amt<0){ b.remb += -amt; b.rembN += 1; } else { b.brut += amt; b.n += 1; }
    b.ht += ht;
    b.net = b.brut - b.remb;
    const src = s.source||"autre"; b.src[src]=(b.src[src]||0)+amt;
  }
  const ordered = Object.values(days).sort((a,b)=>a.key<b.key?-1:1);
  return {today, days:ordered};
}

const SRC_LABEL={pos:"Caisse",front:"Accueil/Web",web:"Web",kiosk:"Borne",back:"Back-office",autre:"Autre"};
const SRC_COLOR={pos:"var(--pos)",front:"var(--front)",web:"var(--web)",kiosk:"var(--web)",back:"var(--other)",autre:"var(--other)"};

function render(agg){
  const tKey=agg.today;
  const t = agg.days.find(d=>d.key===tKey) || {brut:0,remb:0,rembN:0,net:0,ht:0,n:0,src:{}};
  const week = agg.days;
  const total7 = week.reduce((s,d)=>s+d.net,0);
  const brut7 = week.reduce((s,d)=>s+d.brut,0);
  const avg7 = total7/WINDOW_DAYS;
  const avgTicket = t.n? t.brut/t.n : 0;
  const max = Math.max(1, ...week.map(d=>d.net));

  // source chips (aujourd'hui)
  const srcEntries = Object.entries(t.src).filter(([,v])=>v!==0).sort((a,b)=>b[1]-a[1]);
  const chips = srcEntries.map(([k,v])=>
    `<span class="chip"><span class="dot" style="background:${SRC_COLOR[k]||'var(--other)'}"></span>${SRC_LABEL[k]||k} ${eur(v)}</span>`).join("");

  const bars = week.map(d=>{
    const h = Math.round((d.net/max)*100);
    const lab=labelFor(d.key);
    return `<div class="bar ${d.key===tKey?'today':''}">
      <div class="v">${d.net? eur(d.net):''}</div>
      <div class="col" style="height:${Math.max(4,h)}%"></div>
      <div class="d">${lab.wd}</div></div>`;
  }).join("");

  const list = [...week].reverse().map(d=>{
    const lab=labelFor(d.key);
    const isT=d.key===tKey;
    const sub = `Brut ${eur2(d.brut)}${d.rembN?` · ${d.rembN} remb. ${eur2(d.remb)}`:''} · ${d.n} tk`;
    return `<div class="row ${isT?'is-today':''}">
      <div class="day">${isT?'Aujourd’hui '+lab.dm:lab.wd+'. '+lab.dm}<small>${sub}</small></div>
      <div class="val"><b>${eur2(d.net)}</b><small>${eur2(d.ht)} HT</small></div>
    </div>`;
  }).join("");

  const vsAvg = avg7>0 ? Math.round((t.net/avg7-1)*100) : 0;
  const vsTxt = (t.n===0 && t.rembN===0) ? "Pas encore de vente aujourd'hui"
    : (vsAvg>=0? `+${vsAvg}% vs moyenne 7 j` : `${vsAvg}% vs moyenne 7 j`);

  $("#content").innerHTML = `
    <div class="card hero">
      <div class="lbl">Ventes du jour <span class="pill">net encaissé</span></div>
      <div class="amount">${eur2(t.net)}</div>
      <div class="sub">${vsTxt}</div>
      <div class="metrics">
        <div class="metric"><b>${eur2(t.brut)}</b><small>brut</small></div>
        <div class="metric neg"><b>${t.rembN?'−'+eur2(t.remb):eur2(0)}</b><small>${t.rembN} rembours.</small></div>
        <div class="metric"><b>${t.n}</b><small>tickets</small></div>
      </div>
      <div class="subline">Ticket moyen ${t.n?eur2(avgTicket):'—'} · ${eur2(t.ht)} HT</div>
      ${chips?`<div class="chips">${chips}</div>`:''}
    </div>

    <div class="card" id="fillCard">
      <div class="sectiontitle"><b>Remplissage de la journée</b><span id="fillMeta"></span></div>
      <div class="fillbig" id="fillHero"><small>Chargement…</small></div>
      <div class="fillsub" id="fillSub"></div>
      <svg class="fillchart" id="fillChart" viewBox="0 0 520 180" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="filllegend"><span><i></i>Déjà admis</span><span><i class="proj"></i>Réservé à venir</span></div>
    </div>

    <div class="card" id="itemsCard">
      <div class="sectiontitle"><b>Articles vendus aujourd’hui</b><span id="itemsMeta"></span></div>
      <div id="itemsBody"><div class="miniload"><span class="s"></span>Chargement du détail…</div></div>
    </div>

    <div class="card">
      <div class="sectiontitle"><b>7 derniers jours</b><span>${eur2(total7)} net · brut ${eur2(brut7)}</span></div>
      <div class="bars">${bars}</div>
    </div>

    <div class="card">
      <div class="rows">${list}</div>
    </div>

    <div class="card" id="partyCard">
      <div class="sectiontitle"><b>Anniversaires · 7 prochains jours</b><span id="partyMeta"></span></div>
      <div id="partyBody"><div class="miniload"><span class="s"></span>Chargement du planning…</div></div>
    </div>`;

  paintItems();
  renderParties();
  renderFill();
}

// ---- Détail des articles réellement vendus aujourd'hui ----
// Règle : on ne compte les articles que des commandes ENTIÈREMENT payées (sold).
// Les commandes avec acompte seulement (partially_paid/proposal) — ex. anniversaires
// réservés dont le solde se paiera le jour de la fête — ne sont PAS comptées comme
// articles vendus : elles apparaissent en "acompte reçu" pour le seul montant encaissé.
let ITEMS = null; // {day, list:[[label,{qty,amount}]], totalQty, depN, depAmt}

function paintItems(){
  const body=$("#itemsBody"), meta=$("#itemsMeta");
  if(!body) return;
  if(!ITEMS || ITEMS.day!==todayKey()) return; // laisse l'état "Chargement…"
  const hasItems=ITEMS.list.length, hasDep=ITEMS.depN>0;
  if(!hasItems && !hasDep){ body.innerHTML='<div class="miniload">Aucun article vendu aujourd’hui</div>'; if(meta) meta.textContent=""; return; }
  if(meta) meta.textContent = `${ITEMS.totalQty} article${ITEMS.totalQty>1?'s':''}`;
  let html = ITEMS.list.map(([L,v])=>{
    const amt = v.amount ? eur2(v.amount) : '<span class="g">gratuit</span>';
    return `<div class="irow"><span class="iq">${v.qty}×</span><span class="il">${esc(L)}</span><span class="ia">${amt}</span></div>`;
  }).join("");
  if(hasDep){
    html += `<div class="irow dep"><span class="iq">${ITEMS.depN}×</span><span class="il">Acompte reçu<small>solde le jour de la fête</small></span><span class="ia">${eur2(ITEMS.depAmt)}</span></div>`;
  }
  body.innerHTML = html;
}

async function fillTodayItems(rows){
  const today=todayKey();
  const todaySales=rows.filter(s=>s.created_at.slice(0,10)===today && (s.origin_type||"").endsWith("Order") && s.origin_id);
  const paidByOrder={};
  for(const s of todaySales){ paidByOrder[s.origin_id]=(paidByOrder[s.origin_id]||0)+(Number(s.amount)||0); }
  const ids=Object.keys(paidByOrder);
  const meta=$("#itemsMeta");
  if(!ids.length){ ITEMS={day:today,list:[],totalQty:0,depN:0,depAmt:0}; saveItemsCache(); paintItems(); setFillWalk({}); return; }
  const by={}; let depN=0, depAmt=0;
  const walk={}; const ENTRY=/entr[ée]e/i;   // entrées individuelles par heure (remplissage)
  for(let i=0;i<ids.length;i+=8){
    const batch=ids.slice(i,i+8);
    const res=await Promise.allSettled(batch.map(id=>apiGet("/orders/"+id)));
    for(let j=0;j<res.length;j++){
      if(res[j].status!=="fulfilled") continue;
      const o=res[j].value.data||res[j].value, id=batch[j];
      if(o.global_status==="sold"){
        const hh=+String(o.created_at||"").slice(11,13);
        for(const it of (o.items||[])){
          if(/acompte/i.test(it.label||"")) continue;          // exclut les lignes internes d'acompte
          const L=it.label||"(sans nom)";
          if(!by[L]) by[L]={qty:0,amount:0};
          by[L].qty+=(Number(it.qty)||0); by[L].amount+=(Number(it.amount)||0);
          if(ENTRY.test(L) && hh>=0) walk[hh]=(walk[hh]||0)+(Number(it.qty)||0);
        }
      } else if((paidByOrder[id]||0)>0){ depN++; depAmt+=paidByOrder[id]; } // acompte : seulement l'encaissé
    }
    if(meta) meta.textContent=`${Math.min(i+8,ids.length)}/${ids.length} commandes…`;
  }
  const list=Object.entries(by).sort((a,b)=> b[1].qty-a[1].qty || Math.abs(b[1].amount)-Math.abs(a[1].amount));
  const totalQty=list.reduce((s,[,v])=>s+v.qty,0);
  ITEMS={day:today,list,totalQty,depN,depAmt}; saveItemsCache(); paintItems();
  setFillWalk(walk);
}

function saveItemsCache(){ try{ localStorage.setItem("qw_items_v1", JSON.stringify(ITEMS)); }catch(e){} }
function loadItemsCache(){ try{ return JSON.parse(localStorage.getItem("qw_items_v1")); }catch(e){ return null; } }

// ---- Anniversaires des 7 prochains jours ----
// Source : bookings des formules (pack) — le tri par date n'étant pas monotone, on
// scanne les dernières pages puis on filtre par créneau côté client. Chaque fête = une
// commande (order_item.order). On ne garde que les fêtes CONFIRMÉES (acompte payé ou
// soldé) ; les devis/propositions et les lignes de pack sans commande sont ignorés.
// On affiche : type, invités (qty), créneau, lieu, la note privée (note) et le message
// client (front_note). Les fêtes sans note privée sont mises en évidence. Clic = fiche client.
const PARTY_DAYS = 7;
const BOOK_TAIL_PAGES = 25;
let PARTIES = null; // {day, list:[{date,slot,loc,type,guests,note,frontNote,status,number,clientId}]}

function partyNoteEmpty(p){ return !p.note || !String(p.note).trim(); }

function renderParties(){
  const body=$("#partyBody"), meta=$("#partyMeta");
  if(!body) return;
  if(!PARTIES || PARTIES.day!==todayKey()) return; // garde "Chargement…"
  const list=PARTIES.list;
  if(!list.length){ body.innerHTML='<div class="miniload">Aucun anniversaire prévu sur 7 jours</div>'; if(meta) meta.textContent=""; return; }
  const flagged=list.filter(partyNoteEmpty).length;
  if(meta) meta.innerHTML = `${list.length} fête${list.length>1?'s':''}${flagged?` · <b style="color:var(--web)">${flagged} sans note</b>`:''}`;
  const today=todayKey(), WD=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
  let html="";
  for(let i=0;i<PARTY_DAYS;i++){
    const day=keyMinusDays(today,-i);
    const dayP=list.filter(p=>p.date===day);
    if(!dayP.length) continue;
    const dd=new Date(day+"T12:00:00Z");
    const totG=dayP.reduce((s,p)=>s+p.guests,0);
    html+=`<div class="pday"><div class="pdh"><b>${WD[dd.getUTCDay()]} ${dd.getUTCDate()}/${dd.getUTCMonth()+1}</b><span>${dayP.length} fête${dayP.length>1?'s':''} · ${totG} invités</span></div>`;
    const slots=[...new Set(dayP.map(p=>p.slot))].sort();
    for(const s of slots){
      const sp=dayP.filter(p=>p.slot===s).sort((a,b)=>b.guests-a.guests);
      html+=`<div class="psh">${s} · ${sp.reduce((a,p)=>a+p.guests,0)} inv.</div>`;
      for(const p of sp){
        const warn=partyNoteEmpty(p);
        const fn=p.frontNote && String(p.frontNote).trim();
        let notes="";
        if(!warn) notes+=`<div class="pnote">📝 ${esc(String(p.note).trim())}</div>`;
        if(fn)    notes+=`<div class="pnote client">💬 ${esc(fn)}</div>`;
        html+=`<div class="pcard ${warn?'warn':''}" data-i="${list.indexOf(p)}"><div class="ptop"><div class="pg">${p.guests}</div><div class="pi"><b>${esc(p.type)}</b><small>${esc(p.loc)}</small></div>${warn?'<div class="ptag">note vide</div>':''}</div>${notes}</div>`;
      }
    }
    html+=`</div>`;
  }
  body.innerHTML=html;
}

async function fetchUpcomingParties(){
  const today=todayKey();
  const end=keyMinusDays(today, -(PARTY_DAYS-1)); // today + 6 jours
  const meta=$("#partyMeta");
  const first=await apiGet("/bookings?sort=agendas.start_at&page=1");
  const last=first.metadata.lastPage;
  const pages=[]; for(let p=last;p>last-BOOK_TAIL_PAGES && p>=1;p--) pages.push(p);
  const bookings=[]; const seen=new Set();
  for(let i=0;i<pages.length;i+=6){
    const batch=pages.slice(i,i+6);
    const res=await Promise.allSettled(batch.map(p=>apiGet("/bookings?sort=agendas.start_at&page="+p)));
    for(const r of res){ if(r.status==="fulfilled"){ for(const b of (r.value.data||[])){ if(!seen.has(b.id)){ seen.add(b.id); bookings.push(b); } } } }
    if(meta) meta.textContent="chargement…";
  }
  const inWin=bookings.filter(b=>{ const d=((b.agenda&&b.agenda.start_at)||"").slice(0,10); return d>=today && d<=end; });
  const formules=inWin.filter(b=>/formule/i.test((b.activity&&b.activity.label)||""));
  const CONFIRMED=new Set(["partially_paid","sold"]); // acompte payé ou soldé ; on exclut les devis/propositions
  const parties=[]; const seenOrder=new Set();
  for(const b of formules){
    const o=b.order_item&&b.order_item.order;
    if(!o || !CONFIRMED.has(o.global_status)) continue;   // pas de commande confirmée → ignoré
    if(seenOrder.has(o.id)) continue; seenOrder.add(o.id);
    const loc=(b.agenda.location&&b.agenda.location.label)||"?";
    const date=b.agenda.start_at.slice(0,10), slot=b.agenda.start_at.slice(11,16);
    const clientId=o.client_id||b.client_id||null;
    parties.push({date,slot,loc,type:b.activity.label,guests:Number(b.qty)||0,note:o.note,frontNote:o.front_note,status:o.global_status,number:o.number,clientId});
  }
  parties.sort((a,b)=> (a.date+a.slot)<(b.date+b.slot)?-1:1);
  PARTIES={day:today,list:parties}; savePartyCache(); renderParties();

  // Vagues d'arrivées du jour (anniversaires confirmés + groupes) -> graphique de remplissage
  const todayB=bookings.filter(b=>((b.agenda&&b.agenda.start_at)||"").slice(0,10)===today
    && /formule|groupe/i.test((b.activity&&b.activity.label)||""));
  const partyQty={}, groupQty={};   // fêtes dédupliquées par commande ; groupes par créneau+lieu (max)
  for(const b of todayB){
    const o=b.order_item&&b.order_item.order;
    const h=+b.agenda.start_at.slice(11,13), q=Number(b.qty)||0;
    const loc=(b.agenda.location&&b.agenda.location.label)||b.agenda.location_id||"?";
    if(o){ if(!CONFIRMED.has(o.global_status)) continue; if(!partyQty[o.id]||q>partyQty[o.id].qty) partyQty[o.id]={hour:h,qty:q}; }
    else { const k=h+"|"+loc; if(!groupQty[k]||q>groupQty[k].qty) groupQty[k]={hour:h,qty:q}; }
  }
  const waveMap={};
  [...Object.values(partyQty),...Object.values(groupQty)].forEach(w=>{ waveMap[w.hour]=(waveMap[w.hour]||0)+w.qty; });
  const waves=Object.entries(waveMap).map(([h,q])=>({hour:+h,qty:q})).sort((a,b)=>a.hour-b.hour);
  setFillWaves(waves);
}

// v3 : ajout du client_id par fête (pop-up fiche client)
function savePartyCache(){ try{ localStorage.setItem("qw_parties_v3", JSON.stringify(PARTIES)); ["qw_parties_v1","qw_parties_v2"].forEach(k=>localStorage.removeItem(k)); }catch(e){} }
function loadPartyCache(){ try{ return JSON.parse(localStorage.getItem("qw_parties_v3")); }catch(e){ return null; } }

// ---- Remplissage de la journée (courbe cumulée des personnes admises) ----
// walk = entrées individuelles par heure (commandes du jour) ; waves = vagues
// d'anniversaires/groupes réservés (par heure). Cumul solide jusqu'à "maintenant",
// puis projection pointillée avec les vagues encore à venir (déjà réservées).
let FILL = null; // {day, walk:{h:qty}, waves:[{hour,qty}]}
function ensureFill(){ const d=todayKey(); if(!FILL||FILL.day!==d) FILL={day:d,walk:{},waves:[]}; return FILL; }
function setFillWalk(walk){ ensureFill().walk=walk||{}; saveFillCache(); renderFill(); }
function setFillWaves(waves){ ensureFill().waves=waves||[]; saveFillCache(); renderFill(); }
function saveFillCache(){ try{ localStorage.setItem("qw_fill_v1", JSON.stringify(FILL)); }catch(e){} }
function loadFillCache(){ try{ return JSON.parse(localStorage.getItem("qw_fill_v1")); }catch(e){ return null; } }

function nowHourTZ(){
  const p=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  let hh=0,mm=0; for(const x of p){ if(x.type==="hour")hh=+x.value; if(x.type==="minute")mm=+x.value; }
  return hh+mm/60;
}

function renderFill(){
  const svg=$("#fillChart"); if(!svg) return;
  if(!FILL || FILL.day!==todayKey()) return;
  const walk=FILL.walk||{}, waves=(FILL.waves||[]).slice();
  const now=nowHourTZ();
  const waveByHour={}; waves.forEach(w=>waveByHour[w.hour]=(waveByHour[w.hour]||0)+w.qty);
  const dataHours=[...Object.keys(walk).map(Number), ...waves.map(w=>w.hour)];
  let OPEN=10, CLOSE=19;
  if(dataHours.length){ OPEN=Math.min(OPEN,...dataHours); CLOSE=Math.max(CLOSE,...dataHours); }
  const nowX=Math.min(Math.max(now,OPEN),CLOSE);

  // cumul réalisé (heures déjà passées)
  const realized=[]; const arrivedAnno=[]; let cum=0;
  for(let h=OPEN;h<=CLOSE;h++){
    if(h>now) break;
    cum += (Number(walk[h])||0) + (waveByHour[h]||0);
    realized.push([h,cum]);
    if(waveByHour[h]) arrivedAnno.push({hour:h,after:cum,q:waveByHour[h]});
  }
  const nowCum=cum;
  // projection (vagues à venir)
  const upcoming=waves.filter(w=>w.hour>now).sort((a,b)=>a.hour-b.hour);
  let proj=[[nowX,nowCum]]; let pc=nowCum; const upAnno=[];
  for(const w of upcoming){ proj.push([w.hour,pc]); pc+=w.qty; proj.push([w.hour,pc]); upAnno.push({hour:w.hour,after:pc,q:w.qty}); }
  proj.push([CLOSE,pc]);
  const expected=pc;
  const maxY=Math.max(10, expected, nowCum)*1.16;

  const W=520,H=180, padL=8,padR=12,padT=16,padB=20;
  const x=h=>padL+(h-OPEN)/(CLOSE-OPEN||1)*(W-padL-padR);
  const y=v=>H-padB-(v/maxY)*(H-padT-padB);
  const stepPts=pts=>{let d="";pts.forEach((p,i)=>{const X=x(p[0]),Y=y(p[1]);if(i===0)d+=`M${X},${Y}`;else{d+=`L${x(p[0])},${y(pts[i-1][1])} L${X},${Y}`;}});return d;};

  let g="";
  // grille + axes Y
  for(let i=0;i<=3;i++){ const gv=maxY*i/3, yy=y(gv);
    g+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${W-padR}" y="${(yy-3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(gv)}</text>`;
  }
  // axe X (heures)
  for(let h=Math.ceil(OPEN);h<=CLOSE;h++){ g+=`<text x="${x(h).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${h}h</text>`; }
  // aire réalisée
  if(realized.length){
    const areaD=stepPts(realized)+`L${x(nowX)},${y(nowCum)} L${x(nowX)},${y(0)} L${x(OPEN)},${y(0)} Z`;
    g+=`<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.34"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0.04"/></linearGradient></defs>`;
    g+=`<path d="${areaD}" fill="url(#fg)"/>`;
    g+=`<path d="${stepPts([...realized,[nowX,nowCum]])}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  // projection pointillée
  if(upcoming.length){
    g+=`<path d="${stepPts(proj)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // ligne "maintenant" + marqueur
  if(now>=OPEN && now<=CLOSE){
    g+=`<line x1="${x(nowX).toFixed(1)}" y1="${padT-4}" x2="${x(nowX).toFixed(1)}" y2="${H-padB}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity="0.35"/>`;
    if(realized.length) g+=`<circle cx="${x(nowX).toFixed(1)}" cy="${y(nowCum).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`;
  }
  // pastilles de vagues
  const pill=(h,after,q,up)=>{ if(q<6) return ""; const col=up?"var(--web)":"var(--accent)"; const txt="+"+q; const w=txt.length*6.4+10; const cx=Math.max(padL+w/2,Math.min(W-padR-w/2,x(h))); const cy=Math.max(padT+7,y(after)-11);
    return `<g><rect x="${(cx-w/2).toFixed(1)}" y="${(cy-8).toFixed(1)}" width="${w.toFixed(1)}" height="15" rx="7" fill="${col}"/><text x="${cx.toFixed(1)}" y="${(cy+2.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${txt}</text></g>`; };
  arrivedAnno.forEach(a=>g+=pill(a.hour,a.after,a.q,false));
  upAnno.forEach(a=>g+=pill(a.hour,a.after,a.q,true));

  svg.innerHTML=g;

  // en-tête chiffré
  $("#fillHero").innerHTML = nowCum
    ? `${nowCum} <small>admis${expected>nowCum?` · ${expected} attendus`:''}</small>`
    : `<small>Pas encore d'entrée aujourd'hui</small>`;
  const next=upcoming[0];
  $("#fillSub").innerHTML = next
    ? `Prochaine vague : <span class="wave">+${next.qty} invités à ${next.hour}h</span>`
    : (nowCum? "Journée en cours" : "Les arrivées s'afficheront ici au fil de la journée");
  const hh=new Intl.DateTimeFormat("fr-BE",{hour:"2-digit",minute:"2-digit",timeZone:TZ}).format(new Date());
  const mm=$("#fillMeta"); if(mm) mm.textContent=hh;
}

// ---- Pop-up fiche client (au clic sur une fête) ----
const CLIENTS = {}; // cache mémoire des fiches déjà chargées

function whenLabel(p){ return `${p.date.slice(8,10)}/${p.date.slice(5,7)} · ${p.slot} · ${p.guests} inv. · ${esc(p.loc)}`; }
function closeClient(){ $("#clientOverlay").classList.remove("on"); }

async function openClient(p){
  const ov=$("#clientOverlay"), body=$("#clientBody");
  const head=`<div class="cli-h">${esc(p.type)}</div><div class="cli-sub">${whenLabel(p)}</div>`;
  body.innerHTML=head+'<div class="miniload"><span class="s"></span>Chargement de la fiche…</div>';
  ov.classList.add("on");
  if(!p.clientId){ body.innerHTML=head+'<div class="cli-empty">Aucune fiche client liée à cette réservation.</div>'; return; }
  try{
    let c=CLIENTS[p.clientId];
    if(!c){ const d=await apiGet("/clients/"+p.clientId); c=d.data||d; CLIENTS[p.clientId]=c; }
    const name=[c.firstname,c.lastname].filter(Boolean).join(" ").trim() || c.society || "Client";
    const rows=[];
    if(c.society) rows.push(`<div class="cli-row"><span class="ic">🏢</span><span><span class="lbl">Société</span><span class="val">${esc(c.society)}</span></span></div>`);
    if(c.phone)  rows.push(`<a class="cli-row" href="tel:${esc(String(c.phone).replace(/\s/g,''))}"><span class="ic">📞</span><span><span class="lbl">Téléphone</span><span class="val">${esc(c.phone)}</span></span></a>`);
    if(c.phone2) rows.push(`<a class="cli-row" href="tel:${esc(String(c.phone2).replace(/\s/g,''))}"><span class="ic">📱</span><span><span class="lbl">Téléphone 2</span><span class="val">${esc(c.phone2)}</span></span></a>`);
    if(c.email)  rows.push(`<a class="cli-row" href="mailto:${esc(c.email)}"><span class="ic">✉️</span><span><span class="lbl">Email</span><span class="val">${esc(c.email)}</span></span></a>`);
    if(!rows.length) rows.push('<div class="cli-empty">Fiche sans téléphone ni email.</div>');
    body.innerHTML=`<div class="cli-h">${esc(p.type)}</div><div class="cli-name">${esc(name)}</div><div class="cli-sub">${whenLabel(p)}</div>${rows.join("")}`;
  }catch(e){
    body.innerHTML=head+`<div class="cli-empty">Impossible de charger la fiche client (${esc(e.message)}).</div>`;
  }
}

function saveCache(agg){ try{ localStorage.setItem(LS_CACHE, JSON.stringify({t:Date.now(),agg})); }catch(e){} }
function loadCache(){ try{ return JSON.parse(localStorage.getItem(LS_CACHE)); }catch(e){ return null; } }

function setUpdated(ts, live){
  const d=new Date(ts);
  const hh=new Intl.DateTimeFormat("fr-BE",{hour:"2-digit",minute:"2-digit",timeZone:TZ}).format(d);
  $("#updated").innerHTML = `${live?'<span class="pulse"></span>':''}Mis à jour à ${hh}`;
}

let busy=false;
async function refresh(full=true){
  if(busy) return;
  if(!getToken()){ needToken(); return; }
  busy=true; $("#refreshBtn").style.opacity=.4;
  $("#content").querySelector(".err")?.remove();
  if(!$("#content").querySelector(".card")) $("#content").innerHTML='<div class="spin"></div>';
  try{
    const rows = await fetchRecentSales();
    const agg = aggregate(rows);
    render(agg); saveCache(agg); setUpdated(Date.now(), true);
    fillTodayItems(rows).catch(()=>{ const b=$("#itemsBody"); if(b) b.innerHTML='<div class="miniload">Détail des articles indisponible</div>'; });
    if(full) fetchUpcomingParties().catch(()=>{ const b=$("#partyBody"); if(b) b.innerHTML='<div class="miniload">Planning indisponible</div>'; });
  }catch(e){
    if(e.auth){ needToken(); }
    else{
      const cached=loadCache();
      if(cached){ render(cached.agg); setUpdated(cached.t,false);
        $("#content").insertAdjacentHTML("afterbegin",`<div class="err">Hors ligne — données en cache. (${e.message})</div>`); }
      else $("#content").innerHTML=`<div class="err">Impossible de charger les ventes : ${e.message}</div>`;
    }
  }finally{ busy=false; $("#refreshBtn").style.opacity=1; }
}

async function loadVenture(){
  try{ const d=await apiGet("/ventures"); const v=d.data&&d.data[0];
    if(v){ $("#ventureName").textContent=v.name||"Qweekle"; $("#ventureSub").textContent=(v.city||"")+" · Suivi des ventes"; } }catch(e){}
}

// events
$("#refreshBtn").onclick=()=>refresh(true);
$("#saveToken").onclick=()=>{ const v=$("#tokenInput").value.trim(); if(!v)return;
  localStorage.setItem(LS_TOKEN,v); hideToken(); loadVenture(); refresh(true); };
$("#clearToken").onclick=()=>{ ["qw_token","qw_cache_v1","qw_items_v1","qw_parties_v1","qw_parties_v2","qw_parties_v3","qw_fill_v1"].forEach(k=>localStorage.removeItem(k)); location.reload(); };

// clic sur une fête -> pop-up fiche client (délégué sur #content, stable entre les rendus)
$("#content").addEventListener("click", e=>{
  const card=e.target.closest(".pcard"); if(!card) return;
  const i=+card.dataset.i;
  if(PARTIES && PARTIES.list && PARTIES.list[i]) openClient(PARTIES.list[i]);
});
$("#clientClose").onclick=closeClient;
$("#clientOverlay").addEventListener("click", e=>{ if(e.target===$("#clientOverlay")) closeClient(); });

document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(true); });
setInterval(()=>{ if(!document.hidden) refresh(false); }, AUTOREFRESH_MS);

$("#foot").innerHTML="Données Qweekle en direct · l'appareil garde le token en local<br>Aujourd'hui = journée en cours (heure de Bruxelles)";

// boot
(function(){
  ITEMS=loadItemsCache();
  PARTIES=loadPartyCache();
  FILL=loadFillCache();
  const cached=loadCache();
  if(cached){ render(cached.agg); setUpdated(cached.t,false); }
  if(!getToken()){ needToken(); }
  else { loadVenture(); refresh(); }
})();
